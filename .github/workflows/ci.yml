name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

timeout-minutes: 10

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: dojo-frontend/
        run: npm ci

      - name: Build frontend
        working-directory: dojo-frontend/
        run: npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract test dependencies
        working-directory: dojo-contracts/
        run: pip install -r requirements.txt

      - name: Run contract tests
        working-directory: dojo-contracts/
        run: pytest

  integration-test:
    runs-on: ubuntu-latest
    if: ${{ secrets.ADMIN_MNEMONIC != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run integration tests
        env:
          ADMIN_MNEMONIC: ${{ secrets.ADMIN_MNEMONIC }}
          ALGOD_SERVER: https://testnet-api.algonode.cloud
          ESCROW_VAULT_APP_ID: "761941677"
        run: pytest tests/integration/ -v
