name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install py-algorand-sdk pytest pytest-timeout python-dotenv requests

      - name: Collect integration tests
        run: python -m pytest tests/integration/ --collect-only -q 2>&1 || echo "Collection done"

      - name: Check script syntax
        run: python -c "import ast; ast.parse(open('scripts/demo_kite_provenance.py').read()); print('OK')"

      - name: Verify artifacts
        run: |
          ls README.md
          ls VALUE_PROPOSITION.md
          ls GTM_PLAN.md
          ls evidence/APP_ID_VERIFICATION.md
          ls evidence/DORAHACKS_TAGS.md
          echo "All artifacts present"
