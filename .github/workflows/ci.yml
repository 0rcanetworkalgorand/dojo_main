name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

timeout-minutes: 10

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Validate integration test collection
        run: pytest tests/integration/ --collect-only -q

      - name: Validate Kite provenance script syntax
        run: python -c "import ast; ast.parse(open('scripts/demo_kite_provenance.py').read()); print('Syntax OK')"

      - name: Verify documentation files exist
        run: |
          test -f README.md
          test -f VALUE_PROPOSITION.md
          test -f GTM_PLAN.md
          test -f evidence/APP_ID_VERIFICATION.md
          test -f evidence/DORAHACKS_TAGS.md
          echo "All documentation artifacts present ✓"

  integration-test:
    runs-on: ubuntu-latest
    if: ${{ secrets.ADMIN_MNEMONIC != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run integration tests against TestNet
        env:
          ADMIN_MNEMONIC: ${{ secrets.ADMIN_MNEMONIC }}
          ALGOD_SERVER: https://testnet-api.algonode.cloud
          ESCROW_VAULT_APP_ID: "761941677"
        run: pytest tests/integration/ -v
